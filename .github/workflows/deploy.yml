name: Build and Deploy JAR to Lambda

on:
  push:
    branches: [ release/lambda ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Match your project version
          distribution: 'temurin'

      - name: Build Fat JAR
        # This creates the shaded/executable jar with all dependencies
        run: mvn clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp target/*.jar s3://your-bucket-name/myapp.jar

      - name: Update Lambda Code
        run: |
          aws lambda update-function-code \
            --function-name your-lambda-function-name \
            --s3-bucket your-bucket-name \
            --s3-key myapp.jar
